services:
  # 1. Kafka Broker (KRaft Mode - No ZooKeeper)
  kafka:
    image: apache/kafka:3.8.0
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,PLAINTEXT_HOST://0.0.0.0:19092'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:19092'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:9093'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: 'Mk3O9EVhT82SrSIqIvZgog'
    networks:
      - pipeline-net
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
  
  # 2. Ingestion Server
  ingestion-server:
    build: ./ingestion-server
    container_name: ingestion-server
    restart: always
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - KAFKA_BROKER=kafka:9092
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - pipeline-net

  # 3. Hadoop NameNode (HDFS Master)
  namenode:
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
    container_name: namenode
    ports:
      - "9870:9870" # HDFS Web UI
      - "9000:9000" # NameNode IPC port
    environment:
      - CLUSTER_NAME=test-cluster
    env_file:
      - ./hadoop.env
    networks:
      - pipeline-net

  # 4. Hadoop DataNode (HDFS Storage Worker)
  datanode:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    container_name: datanode
    depends_on:
      - namenode
    env_file:
      - ./hadoop.env
    ports:
      - "9864:9864"
    networks:
      - pipeline-net

  # 5. Kafka-to-HDFS lightweight consumer
  data-lake-connector:
    build: ./data-lake-connector
    container_name: data-lake-connector
    environment:
      - KAFKA_BROKER=kafka:9092
      - HDFS_NAMENODE_URL=http://namenode:9870
      - HDFS_RPC_HOST=namenode
      - HDFS_RPC_PORT=9000
    depends_on:
      kafka:
        condition: service_healthy
      namenode:
        condition: service_started
    networks:
      - pipeline-net

networks:
  pipeline-net:
    driver: bridge
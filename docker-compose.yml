services:
  # 1. Kafka Broker
  kafka:
    image: apache/kafka:3.8.0
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,PLAINTEXT_HOST://0.0.0.0:19092'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:19092'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:9093'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: 'Mk3O9EVhT82SrSIqIvZgog'
    networks:
      - ingest-net  
      - storage-net
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  init-kafka:
    image: apache/kafka:3.8.0
    container_name: init-kafka
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - ingest-net
      - storage-net
    command: >
      bash -c "
      echo 'Waiting for Kafka to be ready...' &&
      /opt/kafka/bin/kafka-topics.sh --create --if-not-exists --bootstrap-server kafka:9092 --topic clickstream-raw --partitions 1 --replication-factor 1 &&
      /opt/kafka/bin/kafka-topics.sh --create --if-not-exists --bootstrap-server kafka:9092 --topic fraud-alerts --partitions 1 --replication-factor 1 &&
      echo 'Kafka topics created successfully!'
      "

  # 2. Ingestion Server
  ingestion-server:
    build: ./ingestion-server
    container_name: ingestion-server
    restart: always
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - KAFKA_BROKER=kafka:9092
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - ingest-net

  # 3. Hadoop NameNode (HDFS Master)
  namenode:
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
    container_name: namenode
    ports:
      - "9870:9870" # HDFS Web UI
      - "9000:9000" # NameNode IPC port
    environment:
      - CLUSTER_NAME=test-cluster
    env_file:
      - ./hadoop.env
    networks:
      - storage-net

  # 4. Hadoop DataNode (HDFS Storage Worker)
  datanode:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    container_name: datanode
    depends_on:
      - namenode
    env_file:
      - ./hadoop.env
    ports:
      - "9864:9864"
    networks:
      - storage-net

  # 5. Kafka-to-HDFS lightweight consumer
  data-lake-connector:
    build: ./data-lake-connector
    container_name: data-lake-connector
    environment:
      - KAFKA_BROKER=kafka:9092
      - HDFS_NAMENODE_URL=http://namenode:9870
      - HDFS_RPC_HOST=namenode
      - HDFS_RPC_PORT=9000
    depends_on:
      kafka:
        condition: service_healthy
      namenode:
        condition: service_started
    networks:
      - storage-net

  # 6. Spark cluster — single-node dev setup (master + worker)
  spark-master:
    build: ./spark
    container_name: spark-master
    entrypoint: ["/bin/bash", "-c"]
    command:
      - "mkdir -p /opt/spark/logs && /opt/spark/sbin/start-master.sh && tail -f /opt/spark/logs/*"
    ports:
      - "8081:8080" 
      - "7077:7077" 
    networks:
      - storage-net

  spark-worker:
    build: ./spark
    container_name: spark-worker
    entrypoint: ["/bin/bash", "-c"]
    command:
      - "mkdir -p /opt/spark/logs && /opt/spark/sbin/start-worker.sh spark://spark-master:7077 && tail -f /opt/spark/logs/*"
    environment:
      - SPARK_WORKER_MEMORY=1G
      - SPARK_WORKER_CORES=1
    depends_on:
      - spark-master
    networks:
      - storage-net

  # 7. Speed layer
  speed-layer:
    build: ./spark
    container_name: speed-layer
    entrypoint: ["/opt/spark/bin/spark-submit"]
    command:
      - "--master"
      - "spark://spark-master:7077"
      - "/opt/spark-jobs/speed_layer.py"
    environment:
      - KAFKA_BROKER=kafka:9092
    volumes:
      - ./spark:/opt/spark-jobs
    depends_on:
      kafka:
        condition: service_healthy
      spark-master:
        condition: service_started
      init-kafka:
        condition: service_completed_successfully
    networks:
      - storage-net

networks:
  ingest-net:
    driver: bridge
  storage-net:
    driver: bridge

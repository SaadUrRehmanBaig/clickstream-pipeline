<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Page</title>
    <style>
        :root {
            --bg-primary: #0f172a;
            --bg-card: #1e293b;
            --accent-primary: #38bdf8;
            --text-main: #e2e8f0;
            --text-muted: #94a3b8;
            --success: #34d399;
            --success-bg: rgba(52, 211, 153, 0.1);
            --success-border: #059669;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
            padding: 3rem;
            max-width: 700px;
            background: var(--bg-card);
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        h1 {
            color: var(--accent-primary);
            font-size: 2.2rem;
            margin-bottom: 1rem;
            letter-spacing: -0.025em;
        }
        p {
            color: var(--text-muted);
            font-size: 1.1rem;
            margin: 1rem 0;
            line-height: 1.6;
        }
        .actions {
            margin-top: 2rem;
        }
        .btn {
            background-color: var(--accent-primary);
            color: #0f172a;
            border: none;
            padding: 0.75rem 1.5rem;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .btn:hover {
            opacity: 0.9;
        }
    </style>
    <script src="./js/tracker.js" defer></script>
</head>
<body>
    <div class="container">
        <h1>Test Site</h1>
        <p>Welcome to the Test Site!</p>
        <p>This page is designed to simulate user interactions and generate clickstream events for testing purposes.</p>
        <p>Interact with this page to generate live clickstream payloads routed through Apache Kafka and processed via Apache Spark Structured Streaming.</p>
        
        <div class="actions">
            <button class="btn" id="simulate-btn">Simulate User Interaction Event</button>
        </div>
    </div>
    <script>
        document.getElementById('simulate-btn').addEventListener('click', () => {
            console.log("Simulated interaction event triggered.");
        });
    </script>
</body>
</html>
